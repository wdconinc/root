name: 'ROOT WebAssembly (Emscripten) build'

on:
  push:
    branches:
      - 'master'
      - 'wasm-support'
      - 'wasm-*'
    paths-ignore:
      - 'doc/**'
      - 'documentation/**'
      - 'README/**'
  pull_request:
    branches:
      - 'master'
    paths:
      - 'cmake/toolchains/Emscripten.cmake'
      - 'cmake/modules/SetUpEmscripten.cmake'
      - 'cmake/modules/CheckCompiler.cmake'
      - 'cmake/modules/RootBuildOptions.cmake'
      - 'core/wasm/**'
      - 'io/io/src/RRawFileWasm.cxx'
      - 'io/io/inc/ROOT/RRawFileWasm.hxx'
      - '.github/workflows/wasm.yml'
  workflow_dispatch:
    inputs:
      emsdk_version:
        description: 'emsdk version (default: 4.0.9)'
        required: false
        default: '4.0.9'

env:
  EMSDK_VERSION: ${{ github.event.inputs.emsdk_version || '4.0.9' }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # Minimal ROOT configuration for WASM (no interpreter, no X11, no optional deps)
  CMAKE_OPTS: >-
    -DCMAKE_BUILD_TYPE=Release
    -DCMAKE_C_COMPILER_LAUNCHER=ccache
    -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    -Dminimal=ON
    -Dwasm=ON
    -Dcling=OFF
    -Dbuiltin_cling=OFF
    -Dbuiltin_llvm=OFF
    -Dbuiltin_clang=OFF
    -Druntime_cxxmodules=OFF
    -Dgdml=OFF
    -Dxml=OFF
    -Dhttp=OFF
    -Dssl=OFF
    -Dbuiltin_zlib=ON
    -Dbuiltin_lz4=ON
    -Dbuiltin_lzma=ON
    -Dbuiltin_zstd=ON
    -Dbuiltin_xxhash=ON
    -Dbuiltin_pcre=ON
    -Dbuiltin_freetype=ON

jobs:
  build-wasm:
    name: 'WASM minimal build (emsdk ${{ github.event.inputs.emsdk_version || ''4.0.9'' }})'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout ROOT
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install emsdk ${{ env.EMSDK_VERSION }}
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: '.emsdk-cache'

      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: wasm-ccache-${{ env.EMSDK_VERSION }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            wasm-ccache-${{ env.EMSDK_VERSION }}-${{ github.ref_name }}-
            wasm-ccache-${{ env.EMSDK_VERSION }}-

      - name: Configure ccache
        run: |
          ccache --max-size=500M
          ccache --zero-stats
          # Use compiler content hash (not path/mtime) so ccache hits even
          # when emsdk is reinstalled to a different temp directory.
          ccache --set-config=compiler_check=content

      - name: Restore CMake configure state
        id: cmake-restore
        uses: actions/cache/restore@v4
        with:
          # Cache only the ExternalProject build products (builtins).
          # CMakeCache.txt and CMakeFiles contain absolute paths to the emsdk
          # installation, which changes on every GitHub Actions runner (different
          # temp UUID), so they cannot be cached safely.  The cmake configure
          # step (~20 s) is re-run every time; the builtins cache avoids
          # rebuilding zlib/lz4/zstd/lzma/freetype/pcre (~3 min).
          # Key version v2: strips cmake internal state from ExternalProject dirs.
          path: build-wasm/builtins
          key: wasm-builtins-v2-${{ env.EMSDK_VERSION }}-${{ hashFiles('builtins/**', 'CMakeLists.txt') }}
          restore-keys: |
            wasm-builtins-v2-${{ env.EMSDK_VERSION }}-

      - name: Strip path-dependent cmake state from restored builtins cache
        run: |
          # ExternalProject source/build dirs (especially BUILD_IN_SOURCE ones
          # like ZSTD) embed the absolute emsdk path in CMakeCache.txt and
          # CMakeFiles.  When cmake re-runs an ExternalProject configure step
          # (because the toolchain command line changed with the new emsdk UUID),
          # it may try to re-use stale TryCompile dirs that reference the old
          # path.  Remove cmake internal state; keep only stamp files and
          # installed lib/include artifacts.
          if [ -d build-wasm/builtins ]; then
            find build-wasm/builtins -name CMakeCache.txt \
              ! -path '*-stamp*' -delete 2>/dev/null || true
            find build-wasm/builtins -name CMakeFiles \
              ! -path '*-stamp*' -type d -exec rm -rf {} + 2>/dev/null || true
          fi

      - name: Configure (emcmake)
        run: |
          emcmake cmake -S . -B build-wasm \
            ${{ env.CMAKE_OPTS }}

      - name: Build
        run: |
          cmake --build build-wasm --parallel $(nproc) --target RIO Core root_wasm_bindings ||          cmake --build build-wasm --parallel $(nproc) --target RIO Core

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Save ccache (always, including on failure)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: wasm-ccache-${{ env.EMSDK_VERSION }}-${{ github.ref_name }}-${{ github.sha }}

      - name: Strip path-dependent cmake state from builtins before caching
        if: always()
        run: |
          if [ -d build-wasm/builtins ]; then
            find build-wasm/builtins -name CMakeCache.txt \
              ! -path '*-stamp*' -delete 2>/dev/null || true
            find build-wasm/builtins -name CMakeFiles \
              ! -path '*-stamp*' -type d -exec rm -rf {} + 2>/dev/null || true
          fi

      - name: Save CMake builtins cache (always, including on failure)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build-wasm/builtins
          key: wasm-builtins-v2-${{ env.EMSDK_VERSION }}-${{ hashFiles('builtins/**', 'CMakeLists.txt') }}

      - name: Check WASM artefacts exist
        run: |
          echo "=== build-wasm/lib/ WASM objects ==="
          find build-wasm/lib -name '*.a' | head -20
          echo "=== TEmscriptenSystem compiled ==="
          find build-wasm -name 'TEmscriptenSystem*' | head -5
          echo "=== WASM JS bundle ==="
          find build-wasm/js -name '*.js' -o -name '*.wasm' 2>/dev/null | head -5 || echo "(bindings not built)"

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: root-wasm-libs
          path: build-wasm/lib/*.a
          retention-days: 7

      - name: Upload WASM bundle
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: root-wasm-bundle
          path: |
            build-wasm/js/root.js
            build-wasm/js/root.wasm
          retention-days: 30

  # Deploy GitHub Pages (depends on build so it can include root.js/root.wasm).
  deploy-pages:
    name: 'Deploy GitHub Pages'
    runs-on: ubuntu-24.04
    needs: [build-wasm]
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/wasm-support') && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout ROOT
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download WASM bundle artefact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: root-wasm-bundle
          path: wasm-artefacts

      - name: Stage WASM bundle alongside docs
        run: |
          if [ -f wasm-artefacts/root.js ]; then
            cp wasm-artefacts/root.js  docs/root.js
            cp wasm-artefacts/root.wasm docs/root.wasm
            echo "WASM bundle staged for Pages deploy"
          else
            echo "WASM bundle not available; Pages will run in JSROOT-only mode"
          fi

      - name: Deploy docs/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'docs: update GitHub Pages [skip ci]'
