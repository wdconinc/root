name: 'ROOT WebAssembly (Emscripten) build'

on:
  push:
    branches:
      - 'master'
      - 'wasm-support'
      - 'wasm-*'
    paths-ignore:
      - 'doc/**'
      - 'documentation/**'
      - 'README/**'
  pull_request:
    branches:
      - 'master'
    paths:
      - 'cmake/toolchains/Emscripten.cmake'
      - 'cmake/modules/SetUpEmscripten.cmake'
      - 'cmake/modules/CheckCompiler.cmake'
      - 'cmake/modules/RootBuildOptions.cmake'
      - 'core/wasm/**'
      - 'io/io/src/RRawFileWasm.cxx'
      - 'io/io/inc/ROOT/RRawFileWasm.hxx'
      - '.github/workflows/wasm.yml'
  workflow_dispatch:
    inputs:
      emsdk_version:
        description: 'emsdk version (default: 4.0.9)'
        required: false
        default: '4.0.9'

env:
  EMSDK_VERSION: ${{ github.event.inputs.emsdk_version || '4.0.9' }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # Minimal ROOT configuration for WASM (no interpreter, no X11, no optional deps)
  CMAKE_OPTS: >-
    -DCMAKE_BUILD_TYPE=Release
    -DCMAKE_C_COMPILER_LAUNCHER=ccache
    -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    -Dminimal=ON
    -Dwasm=ON
    -Druntime_cxxmodules=OFF
    -Dcling=OFF
    -Dgdml=OFF
    -Dxml=OFF
    -Dhttp=OFF
    -Dssl=OFF
    -Dbuiltin_zlib=ON
    -Dbuiltin_lz4=ON
    -Dbuiltin_lzma=ON
    -Dbuiltin_zstd=ON
    -Dbuiltin_xxhash=ON
    -Dbuiltin_pcre=ON
    -Dbuiltin_freetype=ON

jobs:
  build-wasm:
    name: 'WASM minimal build (emsdk ${{ github.event.inputs.emsdk_version || ''4.0.9'' }})'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout ROOT
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install emsdk ${{ env.EMSDK_VERSION }}
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: '.emsdk-cache'

      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: wasm-ccache-${{ env.EMSDK_VERSION }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            wasm-ccache-${{ env.EMSDK_VERSION }}-${{ github.ref_name }}-
            wasm-ccache-${{ env.EMSDK_VERSION }}-

      - name: Configure ccache
        run: |
          ccache --max-size=500M
          ccache --zero-stats

      - name: Cache CMake build directory
        uses: actions/cache@v4
        with:
          path: build-wasm
          key: wasm-build-${{ env.EMSDK_VERSION }}-${{ hashFiles('cmake/**', 'core/CMakeLists.txt', 'io/io/CMakeLists.txt') }}
          restore-keys: |
            wasm-build-${{ env.EMSDK_VERSION }}-

      - name: Configure (emcmake)
        run: |
          emcmake cmake -S . -B build-wasm \
            ${{ env.CMAKE_OPTS }}

      - name: Build
        run: |
          cmake --build build-wasm --parallel $(nproc) --target RIO Core root_wasm_bindings ||           cmake --build build-wasm --parallel $(nproc) --target RIO Core

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Check WASM artefacts exist
        run: |
          echo "=== build-wasm/lib/ WASM objects ==="
          find build-wasm/lib -name '*.a' | head -20
          echo "=== TEmscriptenSystem compiled ==="
          find build-wasm -name 'TEmscriptenSystem*' | head -5
          echo "=== WASM JS bundle ==="
          find build-wasm/js -name '*.js' -o -name '*.wasm' 2>/dev/null | head -5 || echo "(bindings not built)"

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: root-wasm-libs
          path: build-wasm/lib/*.a
          retention-days: 7

      - name: Upload WASM bundle
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: root-wasm-bundle
          path: |
            build-wasm/js/root.js
            build-wasm/js/root.wasm
          retention-days: 30

  # Deploy GitHub Pages (depends on build so it can include root.js/root.wasm).
  deploy-pages:
    name: 'Deploy GitHub Pages'
    runs-on: ubuntu-24.04
    needs: [build-wasm]
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/wasm-support') && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout ROOT
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download WASM bundle artefact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: root-wasm-bundle
          path: wasm-artefacts

      - name: Stage WASM bundle alongside docs
        run: |
          if [ -f wasm-artefacts/root.js ]; then
            cp wasm-artefacts/root.js  docs/root.js
            cp wasm-artefacts/root.wasm docs/root.wasm
            echo "WASM bundle staged for Pages deploy"
          else
            echo "WASM bundle not available; Pages will run in JSROOT-only mode"
          fi

      - name: Deploy docs/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'docs: update GitHub Pages [skip ci]'
